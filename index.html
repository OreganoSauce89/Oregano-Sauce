<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@oreganosauce | Links</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0d0221;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 80s Synthwave Moving Grid Background */
        .synthwave-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(to bottom, #020010 0%, #1a0033 50%, #4a0066 80%, #ff007f 100%);
            overflow: hidden;
        }

        /* Retro Sun */
        .retro-sun {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(to bottom, #ffe600, #ff007f);
            box-shadow: 0 0 40px #ff007f, 0 0 80px #ffe600;
            z-index: -2;
        }

        /* Moving Grid Horizon */
        .grid-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55vh;
            perspective: 300px;
            overflow: hidden;
            border-top: 2px solid #ff007f;
            box-shadow: 0 -10px 20px rgba(255, 0, 127, 0.5);
            z-index: -1;
            background: linear-gradient(to bottom, rgba(13, 2, 33, 0.2), #0d0221 90%);
        }

        .grid-lines {
            position: absolute;
            top: -100%;
            left: -50%;
            width: 200%;
            height: 300%;
            background-image: 
                linear-gradient(to right, rgba(0, 242, 254, 0.6) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(0, 242, 254, 0.6) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(75deg);
            animation: moveGrid 2s linear infinite;
        }

        @keyframes moveGrid {
            0% {
                transform: rotateX(75deg) translateY(0);
            }
            100% {
                transform: rotateX(75deg) translateY(50px);
            }
        }

        /* Container Card */
        .card {
            background: rgba(13, 2, 33, 0.85);
            border: 2px solid #00f2fe;
            backdrop-filter: blur(10px);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 0, 127, 0.3);
            text-align: center;
            z-index: 1;
        }

        /* Profile Header */
        .profile-img-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            box-shadow: 0 0 20px #ff007f;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .username {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.05rem;
            color: #00f2fe;
            text-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ff77bc;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            margin-bottom: 28px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Links Section */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 0, 127, 0.15);
            border: 1px solid #ff007f;
            padding: 14px 20px;
            border-radius: 12px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .link-button:hover {
            background: rgba(0, 242, 254, 0.25);
            border-color: #00f2fe;
            color: #ffffff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 20px #00f2fe;
        }

        .link-button i.brand-icon {
            font-size: 1.4rem;
            width: 26px;
            text-align: left;
        }

        /* Brand Colors */
        .link-button.twitch i.brand-icon { color: #a970ff; }
        .link-button.youtube i.brand-icon { color: #ff3333; }
        .link-button.tiktok i.brand-icon { color: #00f2fe; }
        .link-button.instagram i.brand-icon { color: #ff007f; }

        .link-button .fa-chevron-right {
            font-size: 0.9rem;
            color: #ff77bc;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .link-button:hover .fa-chevron-right {
            color: #00f2fe;
            transform: translateX(4px);
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            font-size: 0.85rem;
            color: #a0a0c0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 80s Moving Grid Background Structure -->
    <div class="synthwave-bg">
        <div class="retro-sun"></div>
        <div class="grid-container">
            <div class="grid-lines"></div>
        </div>
    </div>

    <div class="card">
        <!-- Profile Header -->
        <div class="profile-img-container">
            <img src="profile.jpg" alt="Oregano Sauce" class="profile-img">
        </div>
        
        <h1 class="username">@oreganosauce</h1>
        <p class="bio">Livestreamer • Content Creator • Gamer</p>

        <!-- Social Links -->
        <div class="links-container">
            <!-- Twitch -->
            <a href="https://www.twitch.tv/oregano_sauce89" class="link-button twitch" target="_blank" rel="noopener">
                <i class="fa-brands fa-twitch brand-icon"></i>
                <span>Twitch</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@oreganosauce8209" class="link-button youtube" target="_blank" rel="noopener">
                <i class="fa-brands fa-youtube brand-icon"></i>
                <span>YouTube</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@oreganosauce" class="link-button tiktok" target="_blank" rel="noopener">
                <i class="fa-brands fa-tiktok brand-icon"></i>
                <span>TikTok</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/oreganosauce1/" class="link-button instagram" target="_blank" rel="noopener">
                <i class="fa-brands fa-instagram brand-icon"></i>
                <span>Instagram</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 OreganoSauce. All rights reserved.
        </div>
    </div>

</body>
</html>
