<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@oreganosauce | Links</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Global Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d11;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 128, 0.15) 0%, transparent 40%);
        }

        /* Container Card */
        .card {
            background: rgba(22, 22, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Profile Header */
        .profile-img-container {
            width: 104px;
            height: 104px;
            margin: 0 auto 16px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #8a2be2, #ff0080);
            box-shadow: 0 8px 20px rgba(255, 0, 128, 0.3);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .username {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .bio {
            font-size: 0.9rem;
            color: #a0a0b0;
            margin-bottom: 28px;
        }

        /* Links Section */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 20px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-button:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-button i.brand-icon {
            font-size: 1.25rem;
            width: 24px;
            text-align: left;
        }

        /* Brand Colors */
        .link-button.twitch i.brand-icon { color: #9146FF; }
        .link-button.youtube i.brand-icon { color: #FF0000; }
        .link-button.tiktok i.brand-icon { color: #00f2fe; }
        .link-button.instagram i.brand-icon { color: #E1306C; }

        .link-button .fa-chevron-right {
            font-size: 0.8rem;
            color: #606070;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .link-button:hover .fa-chevron-right {
            color: #ffffff;
            transform: translateX(3px);
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #606070;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Profile Header -->
        <div class="profile-img-container">
            <img src="profile.jpg" alt="Oregano Sauce" class="profile-img">
        </div>
        
        <h1 class="username">@oreganosauce</h1>
        <p class="bio">Livestreamer • Content Creator • Gamer</p>

        <!-- Social Links -->
        <div class="links-container">
            <!-- Twitch -->
            <a href="https://www.twitch.tv/oregano_sauce89" class="link-button twitch" target="_blank" rel="noopener">
                <i class="fa-brands fa-twitch brand-icon"></i>
                <span>Watch Live on Twitch</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@oreganosauce8209" class="link-button youtube" target="_blank" rel="noopener">
                <i class="fa-brands fa-youtube brand-icon"></i>
                <span>YouTube Videos & VODs</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@oreganosauce" class="link-button tiktok" target="_blank" rel="noopener">
                <i class="fa-brands fa-tiktok brand-icon"></i>
                <span>TikTok Clips & Short Content</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/oreganosauce1/" class="link-button instagram" target="_blank" rel="noopener">
                <i class="fa-brands fa-instagram brand-icon"></i>
                <span>Gaming Instagram</span>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 OreganoSauce. All rights reserved.
        </div>
    </div>

</body>
</html>
